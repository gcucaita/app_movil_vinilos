name: Android Pipeline

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

jobs:
  feature_to_develop:
    name: Validar feature -> develop
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'develop' && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Correr pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest

      - name: Generar APK debug
        run: ./gradlew :app:assembleDebug

      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-develop-test-report
          path: app/build/reports/tests/

  develop_to_release:
    name: Validar develop -> release
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'release' && github.head_ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Correr pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest

      - name: Generar APK candidato
        run: ./gradlew :app:assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release_to_main:
    name: Publicar release desde release -> main
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main' && github.head_ref == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Calcular siguiente version
        id: version
        run: |
          BASE_VERSION=$(grep 'versionName' app/build.gradle.kts | grep -o '".*"' | tr -d '"')
          LAST_VERSION=$(git tag --list | sed -E 's/^v\.?//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          if [ -z "$LAST_VERSION" ]; then
            NEXT_VERSION="$BASE_VERSION"
          else
            HIGHEST_VERSION=$(printf "%s\n%s\n" "$BASE_VERSION" "$LAST_VERSION" | sort -V | tail -n 1)

            if [ "$HIGHEST_VERSION" = "$BASE_VERSION" ] && [ "$BASE_VERSION" != "$LAST_VERSION" ]; then
              NEXT_VERSION="$BASE_VERSION"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
              NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Version calculada: $NEXT_VERSION"

      - name: Crear tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Generar APK final
        run: ./gradlew :app:assembleDebug

      - name: Renombrar APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/vinilos-app-${{ steps.version.outputs.version }}.apk

      - name: Crear Release y subir APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/debug/vinilos-app-${{ steps.version.outputs.version }}.apk
